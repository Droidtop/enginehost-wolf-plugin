name: Tools

# The survey tool's unit tests. Runs on every
# branch: these are plain Python and need no Android toolchain.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Survey tool tests
        run: python3 -m unittest discover -s tools/survey -v
